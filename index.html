<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Activos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  .card h3{
  margin-top:0;
  color:#1e293b;
}

.card p{
  margin:8px 0;
  font-size:14px;
}

.card b{
  color:#555;
}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f4f6f9;
}

/* NAVBAR */
.navbar{
  width:100%;
  height:140px;
  background-image:url('encabezado.png');
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  background-color:white;
}

/* CONTENEDOR */
.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}

/* HEADER CARD */
.header{
  display:flex;
  align-items:center;
  gap:20px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

#foto{
  width:300px;
  height:180px;
  border-radius:10px;
  object-fit:cover;
  border:3px solid #e5e7eb;

}

/* TEXTO */
h1{
  margin:0;
}

.estado{
  margin-top:10px;
  padding:6px 15px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}

.activo{background:#2ecc71;color:white;}
.uso{background:#f39c12;color:white;}
.inactivo{background:#e74c3c;color:white;}

/* GRID */
.grid{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card b{
  color:#888;
  font-size:13px;
}

/* BOTON */
.footer{
  margin-top:25px;
  text-align:right;
}

.btn{
  background:#2563eb;
  color:white;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn:hover{
  background:#1d4ed8;
}

/* ERROR */
.error{
  text-align:center;
  margin-top:50px;
  color:red;
  font-size:20px;
}
</style>
</head>

<body>
<div class="navbar">
  <img src="encabezado.png" alt="Encabezado institucional">
</div>

<div class="container">

  <div id="contenido" style="display:none;">

    <div class="header">
      <img id="foto">
      <div>
        <h1 id="nombre"></h1>
        <span id="estado" class="estado"></span>
      </div>
    </div>

 <div class="grid">

  <div class="card">
    <h3>📋 Información General</h3>
    <p><b>No. Inventario:</b> <span id="idactivo"></span></p>
    <p><b>No. Serie:</b> <span id="serie"></span></p>
    <p><b>Fecha de adquisición:</b> <span id="fecha"></span></p>
  </div>

  <div class="card">
    <h3>🖨️ Equipo</h3>
    <p><b>Descripción:</b> <span id="descripcion"></span></p>
    <p><b>Marca:</b> <span id="marca"></span></p>
    <p><b>Modelo:</b> <span id="modelo"></span></p>
    <p><b>Color:</b> <span id="color"></span></p>
  </div>

  <div class="card">
    <h3>📍 Ubicación</h3>
    <p><b>Área:</b> <span id="area"></span></p>
    <p><b>Ubicación:</b> <span id="ubicacion"></span></p>
    <p><b>Responsable:</b> <span id="responsable"></span></p>
  </div>

  <div class="card">
    <h3>⚙️ Estado del Bien</h3>
    <p id="condicion"></p>
  </div>

    <div class="footer">
      <button class="btn" onclick="mantenimiento()">Registrar mantenimiento</button>
    </div>

  </div>

  <div id="error" class="error"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

Papa.parse("datos.csv", {
download:true,
header:true,
complete:function(results){

const activo = results.data.find(p => p.id && p.id.trim() == id);

if(activo){

document.getElementById("contenido").style.display="block";

document.getElementById("foto").src = activo.foto;
document.getElementById("nombre").innerText = activo.nombre;
document.getElementById("descripcion").innerText = activo.descripcion;
document.getElementById("ubicacion").innerText = activo.ubicacion;
document.getElementById("responsable").innerText = activo.responsable;
document.getElementById("idactivo").innerText = activo.id;
document.getElementById("serie").innerText = activo.serie;
document.getElementById("marca").innerText = activo.marca;
document.getElementById("modelo").innerText = activo.modelo;
document.getElementById("color").innerText = activo.color;
document.getElementById("area").innerText = activo.area;
document.getElementById("fecha").innerText = activo.fecha;
document.getElementById("condicion").innerText = activo.condicion;

const estado = document.getElementById("estado");
estado.innerText = activo.estado;

if(activo.estado.toLowerCase() == "activo"){
estado.classList.add("activo");
}else if(activo.estado.toLowerCase() == "en uso"){
estado.classList.add("uso");
}else{
estado.classList.add("inactivo");
}

}else{
document.getElementById("error").innerText = "❌ Activo no encontrado";
}

}
});

/* BOTON FUNCIONAL */
function mantenimiento(){
alert("Función de mantenimiento en desarrollo 🔧");

// aquí después puedes conectar:
// - Google Forms
// - otra página
// - registro en Sheets
}

</script>

</body>
</html>
