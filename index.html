<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Activos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#1f4037,#99f2c8);
}

.container{
  max-width:900px;
  margin:50px auto;
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

/* HEADER */
.header{
  background:#0f2027;
  color:white;
  padding:25px;
  display:flex;
  align-items:center;
  gap:20px;
}

#foto{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid white;
}

.header h1{
  margin:0;
}

.estado{
  margin-top:8px;
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
}

.activo{background:#2ecc71;}
.uso{background:#f1c40f;}
.inactivo{background:#e74c3c;}

/* GRID */
.content{
  padding:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:#f8f9fa;
  padding:20px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card b{
  color:#555;
  display:block;
  margin-bottom:5px;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
}

.btn{
  background:#007bff;
  color:white;
  padding:12px 25px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.btn:hover{
  background:#0056b3;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img id="foto">
    <div>
      <h1 id="nombre"></h1>
      <span id="estado" class="estado"></span>
    </div>
  </div>

  <div class="content">

    <div class="grid">

      <div class="card">
        <b>Descripción</b>
        <span id="descripcion"></span>
      </div>

      <div class="card">
        <b>Ubicación</b>
        <span id="ubicacion"></span>
      </div>

      <div class="card">
        <b>Responsable</b>
        <span id="responsable"></span>
      </div>

      <div class="card">
        <b>ID Activo</b>
        <span id="idactivo"></span>
      </div>

    </div>

  </div>

  <div class="footer">
    <button class="btn">Registrar mantenimiento</button>
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

Papa.parse("datos.csv", {
download:true,
header:true,
complete:function(results){

const activo = results.data.find(p => p.id.trim() == id.trim());

if(activo){

document.getElementById("foto").src = activo.foto.trim();
document.getElementById("nombre").innerText = activo.nombre;
document.getElementById("descripcion").innerText = activo.descripcion;
document.getElementById("ubicacion").innerText = activo.ubicacion;
document.getElementById("responsable").innerText = activo.responsable;
document.getElementById("idactivo").innerText = activo.id;

const estado = document.getElementById("estado");
estado.innerText = activo.estado;

if(activo.estado.toLowerCase() == "activo"){
estado.classList.add("activo");
}else if(activo.estado.toLowerCase() == "en uso"){
estado.classList.add("uso");
}else{
estado.classList.add("inactivo");
}

}

}
});

</script>

</body>
</html>
