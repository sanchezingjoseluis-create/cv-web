<img id="foto" width="200">

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

Papa.parse("datos.csv", {
download: true,
header: true,
complete: function(results) {

const persona = results.data.find(p => p.id.trim() == id.trim());

if(persona){
document.getElementById("foto").src = persona.foto.trim();
document.getElementById("nombre").innerText = persona.nombre;
document.getElementById("profesion").innerText = persona.profesion;
document.getElementById("telefono").innerText = persona.telefono;
document.getElementById("email").innerText = persona.email;
document.getElementById("descripcion").innerText = persona.descripcion;
}

}
});

</script>
